name: Build and Deploy Digital Banking Application using GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend-service
          - auth-service
          - account-service
          - beneficiary-service
          - payment-service
          - transaction-service

    steps:
      - name: Checkout at Git repository
        uses: actions/checkout@v4

      - name: Set up Docker Image Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./app-code
          file: ./app-code/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  deploy-minikube:
    needs: build-and-push
    # Uses a self-hosted runner on the machine hosting Minikube so kubectl can reach the cluster.
    # Remove or change this job if you only want GHCR image builds on GitHub-hosted runners.
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure digital-banking namespace exists
        shell: pwsh
        run: |
          kubectl create namespace digital-banking --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests and roll out all services
        shell: pwsh
        run: |
          $SERVICES = @(
            "frontend-service",
            "auth-service",
            "account-service",
            "beneficiary-service",
            "payment-service",
            "transaction-service"
          )

          foreach ($svc in $SERVICES) {
            $manifestDir = Join-Path $PSScriptRoot "..\..\K8S\services\$svc"
            if (Test-Path $manifestDir) {
              kubectl apply -f $manifestDir -n digital-banking
              kubectl rollout restart "deployment/$svc" -n digital-banking
              kubectl rollout status "deployment/$svc" -n digital-banking --timeout=120s
            }
          }