name: Secure Build, Scan & Push Digital Banking App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: digital-banking-app
  cancel-in-progress: true
jobs:
  scan-code:
    name: Block Vulnerable Code, Dependencies & Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository with Trivy (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./app-code"
          scanners: "vuln,secret"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          format: "table"

  build-scan-push:
    name: Build, Gate Image & Push (${{ matrix.service }})
    needs: scan-code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend-service
          - auth-service
          - account-service
          - beneficiary-service
          - payment-service
          - transaction-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally without pushing
        uses: docker/build-push-action@v6
        with:
          context: ./app-code
          file: ./app-code/Dockerfile
          load: true
          push: false
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

      - name: Block vulnerable container image before push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          format: "table"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified container image to GHCR
        if:  github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: ./app-code
          file: ./app-code/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  deploy-minikube:
    name: Deploy to Minikube (Self-Hosted Windows)
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure digital-banking namespace exists
        shell: powershell
        run: |
          kubectl create namespace digital-banking --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests from K8S/services and roll out
        shell: powershell
        run: |
          $SERVICES = @(
            "frontend-service",
            "auth-service",
            "account-service",
            "beneficiary-service",
            "payment-service",
            "transaction-service"
          )

          foreach ($svc in $SERVICES) {
            $manifestDir = Join-Path (Get-Location).Path "K8S\services\$svc"
            if (Test-Path $manifestDir) {
              kubectl apply -f $manifestDir -n digital-banking
              kubectl rollout restart "deployment/$svc" -n digital-banking
              kubectl rollout status "deployment/$svc" -n digital-banking --timeout=120s
            }
          }
