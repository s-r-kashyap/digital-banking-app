apiVersion: apps/v1
kind: Deployment
metadata:
  name: beneficiary-service
  namespace: digital-banking
  labels:
    app: beneficiary-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: beneficiary-service
  template:
    metadata:
      labels:
        app: beneficiary-service
    spec:
      imagePullSecrets:
        - name: registry-creds
      containers:
        - name: beneficiary-service
          image: ghcr.io/s-r-kashyap/digital-banking-app/beneficiary-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
